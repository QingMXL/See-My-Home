schema_version: "1.0"
knowledge_base_version: "0.2-production"
style:
  id: california_modern
  display_name: California Modern
  display_name_zh: 加州现代
  market: en-US
  status: production
  tagline: Sunlit, natural, relaxed modern living.
  definition: >-
    A contemporary residential language rooted in natural light, indoor-outdoor
    continuity, warm tactile materials, comfortable proportions, and an edited
    mix of modern, vintage-inspired, and handcrafted pieces.

provenance:
  research_anchors:
    - organization: Marmol Radziner
      role: california_modernism_and_indoor_outdoor_continuity
    - organization: Amber Interiors
      role: livable_eclectic_layering
    - organization: Studio Shamshiri
      role: architectural_respect_and_refined_material_tension
    - organization: Commune Design
      role: residential_craft_and_context
  production_prompt_uses_names: false
  reference_images_internal_only: true

profiles:
  sunlit-casual:
    default: true
    intensity: relaxed
    suitable_for: [apartment, condo, townhouse, single_family_home, living_room, bedroom]
    cues: [sun_washed_warm_white, honey_oak, linen, softly_worn_wool, restrained_charcoal]
  ranch-modern:
    default: false
    intensity: grounded
    gates: [source_architecture_supports_ranch_character]
    cues: [warm_plaster, existing_timber, terracotta, grounded_stone, refined_modern_furniture]
  coastal-modern:
    default: false
    intensity: airy
    cues: [pale_sand, lightly_bleached_wood, quiet_limestone, muted_blue_gray]
  desert-warm:
    default: false
    intensity: earthy
    cues: [warm_mineral_plaster, clay, tobacco_leather, dry_climate_plant]

style_dna:
  required: [light_leads, indoor_outdoor_or_contextual_continuity, warm_modern_envelope, lived_in_curation, comfort_before_display, edited_naturalism]
  preferred: [relaxed_asymmetry, low_horizontal_lines, vintage_contemporary_mix, handcrafted_accents]
  forbidden: [farmhouse_theme, nautical_coastal_theme, boho_overload, all_pale_wood_japandi, architecture_change_without_explicit_scope]

composition:
  target_visual_density: "50-65%"
  visual_rest_target: "35-50%"
  maximum_pattern_families_per_view: 2
  maximum_primary_focal_points_per_view: 1
  plant_count_guidance: "1-3 realistically scaled plants"
  material_formula: [one_warm_mineral_or_woven_envelope, one_dominant_natural_wood, one_grounded_stone_or_terracotta_surface, three_tactile_textiles, one_restrained_dark_or_aged_metal_accent, optional_new_material_accent]
  furniture_formula: [one_deep_comfortable_sofa_or_bed, one_or_two_non_matching_vintage_inspired_or_handcrafted_counterpoints, one_substantial_wood_stone_or_resin_table, relaxed_full_height_window_treatment]

vocabulary:
  space: [sunlit, open_yet_grounded, indoor_outdoor_continuity, unforced_zoning, residential_scale]
  form: [clean_planes, softened_geometry, low_horizontal_lines, relaxed_asymmetry, simple_built_ins]
  material: [limewash, grasscloth, woven_linen_wallcovering, warm_white_oak, aged_oak, burl_wood, honed_limestone, travertine, terracotta, linen, wool, boucle, saddle_leather, cast_resin, translucent_acrylic, smoked_or_colored_glass]
  color: [sun_washed_white, sand, oatmeal, warm_greige, honey_wood, sage, clay, charcoal_accent]
  furnishing: [deep_comfortable_sofa, non_matching_sling_leather_cane_or_sculptural_chair, substantial_burl_aged_oak_stone_or_resin_table, hand_knotted_rug, casual_drapery, collected_ceramics]
  lighting: [abundant_natural_light, warm_ambient_light, soft_wall_wash, simple_sculptural_pendant, low_glare]

materials:
  primary:
    - {id: limewash_or_mineral_plaster, finish: warm_low_reflection, avoid: [cave_texture, dirty_mottling]}
    - {id: warm_white_oak, finish: matte_visible_grain, avoid: [gray_wash, orange_gloss]}
    - {id: aged_oak, finish: authentic_light_patina, maximum_role: accent_or_single_furniture_family}
    - {id: honed_limestone_or_travertine, finish: quiet_honed, maximum_focal_surfaces_per_view: 1}
    - {id: terracotta_or_saltillo, finish: matte_warm_earth, gates: [profile_or_source_context_supports]}
  secondary: [walnut, burl_wood, grasscloth, woven_linen_wallcovering, upholstered_textile_panel, handmade_tile, linen, wool, boucle, saddle_leather, aged_brass, blackened_metal]
  accents:
    - id: cast_resin_or_translucent_acrylic
      use: [single_coffee_or_side_table, lamp_base, sculptural_object]
      maximum_share: "approximately 5%"
      avoid: [cold_clear_plastic, novelty_furniture]
    - id: smoked_or_colored_glass_or_perforated_metal
      use: [single_light, side_piece, screen_detail]
      maximum_focal_objects_per_view: 1

surface_system:
  major_wall_options: [warm_limewash, mineral_plaster, grasscloth, woven_linen_wallcovering, shallow_white_oak_panel, restrained_upholstered_textile_panel, handmade_tile_in_wet_or_service_zone]
  pattern_options: [quiet_woven_stripe, tonal_geometric, small_scale_naturalistic_pattern]
  ceiling_options: [shallow_plaster_cove, slim_perimeter_reveal, limited_warm_oak_inset, continuous_warm_indirect_light]
  lighting_options: [linen_or_parchment_pendant, frosted_glass_fixture, carved_wood_or_woven_fixture, wall_wash, task_or_face_level_light]
  rules: [resolve_at_least_one_major_wall_when_editable, replace_or_integrate_generic_construction_downlights, never_change_structural_ceiling_geometry]

color_system:
  dominant: {target_share: "approximately 60%", colors: [sun_washed_white, warm_ivory, sand, light_greige]}
  secondary: {target_share: "approximately 25-30%", colors: [honey_oak, aged_oak, oatmeal, warm_stone]}
  accent: {maximum_share: "approximately 10-15%", colors: [sage, olive, clay, tobacco, muted_blue_gray, charcoal]}
  forbidden: [cold_blue_white_and_gloss_black, navy_white_nautical_theme, saturated_southwestern_palette, all_gray_flip_palette]

anti_patterns:
  farmhouse: [barn_door, farmhouse_sign, distressed_white_furniture, industrial_cage_pendant]
  coastal_cliche: [nautical_stripes, anchors, shells, rope_decor, beach_sign]
  boho_overload: [macrame_overload, rattan_everywhere, dense_global_prints, plant_jungle]
  showroom_drift: [sterile_all_white, matching_furniture_set, cold_gray_laminate, empty_staging]
  hospitality_drift: [hotel_lobby, monumental_chandelier, double_height_fantasy, formal_lobby_symmetry]

immutable_semantics:
  always_preserve: [source_aspect_ratio, crop, framing, camera_position, camera_height, focal_length_feel, vanishing_points, room_envelope, walls, columns, beams, ceiling_height, doors, windows, openings, door_and_window_panel_divisions]
  preserve_by_default: [fixed_cabinet_boundaries, kitchen_service_locations, bathroom_service_locations, fireplace]
  note: >-
    Semantic requirements only. The agent must enforce them with masks,
    spatial conditioning, generation controls, and post-generation validation.

renovation_levels:
  furnish:
    editable: [movable_furniture, rugs, curtains, freestanding_lighting, art, plants, decor]
  refresh:
    editable: [paint, wall_finish, floor_finish, ceiling_finish_without_structural_change, shallow_perimeter_cove, cabinet_front_finish, movable_furniture, lighting, textiles, decor]
  light-remodel:
    editable: [explicitly_masked_non_structural_built_ins]
    requires_explicit_mask: true

room_recipes:
  living_room:
    required: [deep_comfortable_sofa, non_matching_sling_leather_cane_or_sculptural_seating, substantial_wood_stone_or_resin_table, correctly_sized_rug, clear_circulation]
    preferred: [existing_view_or_art_as_focal_point, artisanal_floor_lamp, grouped_ceramics, one_realistic_plant]
    avoid: [invented_fireplace, matching_set, blocked_window, lobby_layout]
  primary_bedroom:
    required: [calm_layering, functional_bedside_surfaces, breathable_bedding, warm_low_glare_light]
    preferred: [simple_upholstered_or_timber_bed, relaxed_drapery]
    avoid: [hotel_suite_staging, rigid_symmetry, excessive_decor]
  kitchen_dining:
    required: [preserved_services, realistic_clearances, practical_storage]
    preferred: [warm_timber_or_warm_white_cabinetry, quiet_stone, informal_sociable_dining]
    avoid: [display_kitchen_theater, overloaded_open_shelves, fantasy_island]
  bathroom:
    required: [preserved_fixture_locations, plausible_wet_zone, maintainable_surfaces]
    preferred: [warm_honed_stone, pale_timber, soft_face_level_light]
    avoid: [cave_spa, plant_jungle, all_over_microcement, fantasy_wet_room]

raw_shell_rules:
  immutable: [visible_walls, slab_edges, beams, columns, ceiling_planes, door_openings, window_openings]
  add: [plausible_finishes, shallow_non_structural_ceiling_treatment, layered_lighting, justified_cabinetry, complete_furniture_group, textiles, restrained_decor]
  never_invent: [new_windows, new_doors, fireplace, arches, beams, stairs, mezzanine, vaulted_ceiling]
  daylight_assumption: conservative
  service_assumption: conservative

style_evaluation:
  scoring_range_per_dimension: [0, 4]
  publish_threshold: 22
  dimensions: [natural_light_response, contextual_continuity, warm_material_authenticity, residential_comfort, curated_old_new_layering, visual_edit_discipline, differentiation_from_adjacent_styles]
  hard_fail: [immutable_architecture_changed, camera_or_crop_changed, invented_architecture, farmhouse_coastal_or_boho_theme, generic_beige_or_matching_set_result, finish_enabled_result_has_blank_ceiling_or_only_isolated_downlights, finish_enabled_result_leaves_major_wall_unresolved, impossible_kitchen_or_bathroom_services, blocked_circulation]
  identity_gate:
    minimum_families_present: 5
    families:
      light_and_envelope: [sunlit_response, warm_mineral_or_woven_wall, indoor_outdoor_or_contextual_continuity]
      furniture_mix: [deep_comfortable_primary_piece, non_matching_vintage_or_handcrafted_counterpoint, substantial_table]
      natural_materials: [one_coherent_oak_family, one_honed_stone_or_terracotta_note, three_tactile_textile_layers]
      crafted_detail: [collected_ceramics_or_timbers, aged_metal, optional_warm_new_material_accent]
      designed_ceiling_and_light: [shallow_reveal_or_cove, sculptural_fixture, wall_wash_task_or_face_level_light]

retrieval:
  required_keys: [style_id, profile, room_type, renovation_level]
  optional_keys: [room_size_band, daylight_level]
  retrieve_entire_knowledge_base: false

schema_version: "1.0"
knowledge_base_version: "0.3-production"
style:
  id: modern_east
  display_name: Modern East
  display_name_zh: 摩登东方
  market: en-US
  status: production
  tagline: A refined balance of modern form, natural materials, and Eastern restraint.
  definition: >-
    A contemporary residential language that expresses Eastern ideas through
    spatial restraint, layered views, negative space, natural materiality and
    time-aware light rather than literal historical symbols.

provenance:
  theory_anchor:
    organization: W.DESIGN
    source_url: https://www.wdesign.hk/modengdongfang.html
  visual_references:
    - organization: W.DESIGN
      role: spatial_poetry_and_abstraction
    - organization: CCD
      role: material_refinement_and_contemporary_luxury
  production_prompt_uses_firm_names: false
  reference_images_internal_only: true

profiles:
  quiet-poise:
    default: true
    suitable_for: [apartment, condo, townhouse, single_family_home, bedroom, family_room]
    intensity: medium_high
    cues: [warm_pale_neutrals, tactile_textiles, substantial_dark_timber_datum, soft_daylight, confident_abstract_art, complete_furnishing]
  urban-elegance:
    default: false
    suitable_for: [urban_apartment, penthouse, open_living_dining]
    intensity: medium
    cues: [slim_dark_frames, smoked_glass, warm_gray, espresso_tones, precise_metal_details]
  sculptural-luxe:
    default: false
    suitable_for: [large_residence, double_height_living]
    intensity: expressive
    gates: [adequate_room_size, explicit_user_preference]
    cues: [single_sculptural_focal_point, statement_light, focal_stone, controlled_contrast]
  warm-residence:
    default: false
    suitable_for: [small_home, bedroom, family_room]
    intensity: soft
    cues: [warm_pale_oak, ivory_textiles, soft_ambient_light, small_amount_dark_framing]

style_dna:
  required:
    - modern_frame_eastern_spirit
    - active_negative_space
    - layered_revelation
    - quiet_material_contrast
    - nature_through_light_and_framing
    - art_integrated_with_daily_life
    - three_family_identity_anchor
  preferred:
    - one_primary_focal_point
    - balanced_asymmetry
    - low_glare_layered_light
    - conventional_residential_scale
    - fully_resolved_furnishing
    - designed_fifth_plane
  forbidden:
    - literal_historical_theme
    - japanese_room_language
    - generic_beige_contemporary
    - generic_warm_minimalism
    - monumental_hospitality_scale
    - material_overload
    - architecture_change_without_explicit_scope

composition:
  target_visual_density: "50-65%"
  visual_rest_target: "35-50%"
  maximum_pattern_families_per_view: 2
  maximum_primary_focal_points_per_view: 1
  material_formula: [one_mineral_or_textile_envelope, one_substantial_dark_timber_datum, one_honed_stone_anchor, three_tactile_textile_layers, one_restrained_bronze_family, optional_new_material_accent]
  furniture_formula: [comfortable_contemporary_primary_seating, one_contemporary_ming_derived_piece, one_functional_joinery_side_piece, correctly_scaled_rug]
  cultural_formula: [ink_wash_abstraction, contemporary_diffused_lantern_light, one_celadon_smoky_glazed_black_stoneware_or_stone_vessel]

vocabulary:
  space:
    - layered views
    - framed sightlines
    - calibrated negative space
    - quiet spatial rhythm
    - open yet zoned
    - residential scale
  form:
    - clean architectural planes
    - restrained geometry
    - softened corners
    - one controlled sculptural gesture
    - slender dark frames
    - balanced asymmetry
  material:
    - matte dark oak
    - smoked walnut
    - warm pale oak
    - honed limestone
    - quiet-veined marble
    - mineral plaster
    - textured wallcovering
    - woven silk wallcovering
    - shallow upholstered textile panel
    - reeded glass
    - satin bronze
    - blackened metal
    - linen
    - wool
    - boucle
    - nubby wool
    - tea-smoked acrylic
    - cast resin
    - hand-finished lacquer
    - colored glass
  color:
    - warm ivory
    - stone greige
    - mushroom taupe
    - espresso brown
    - charcoal
    - ink black accents
    - muted jade
    - olive green
    - aged bronze
  furnishing:
    - tailored contemporary seating
    - abstracted Ming-derived yoke-back chair
    - abstracted horseshoe-back lounge chair
    - restrained joinery stool or bench
    - bridged-frame side table
    - tactile neutral upholstery
    - ink-wash abstract artwork
    - celadon or smoky-glazed vessel
    - black stoneware or carved-stone object
    - natural branch arrangement
    - layered neutral rug
  lighting:
    - soft daylight
    - warm indirect lighting
    - concealed cove light
    - focused wall wash
    - paper-like diffused pendant
    - low-glare fixtures
    - shallow perimeter reveal
    - room-scaled statement fixture
    - contemporary lantern-like pendant

materials:
  primary:
    - id: matte_dark_oak
      finish: matte_open_grain
      use: [door_frames, partial_wall_panels, cabinetry, furniture_frames]
      avoid: [glossy_red_tone, full_room_wrap]
    - id: smoked_walnut
      finish: matte_or_satin
      use: [cabinetry, furniture, portals]
      avoid: [high_gloss]
    - id: warm_pale_oak
      finish: matte
      use: [bedrooms, kitchens, small_residences]
      pairing_requirement: dark_frame_or_stone_anchor
    - id: pale_honed_stone
      finish: honed_low_reflection
      use: [countertops, fireplace, single_feature_plane]
      avoid: [multiple_competing_veins]
    - id: quiet_veined_marble
      finish: honed_or_soft_satin
      max_focal_surfaces_per_view: 1
  secondary:
    - mineral_plaster
    - fine_textured_wallcovering
    - woven_silk_or_linen_wallcovering
    - shallow_upholstered_textile_panel
    - reeded_glass
    - smoked_glass
    - satin_bronze
    - blackened_steel
    - linen
    - wool
    - boucle
  accents:
    - id: tea_smoked_acrylic_or_cast_resin
      use: [side_table, lamp_base, small_sculptural_object]
      maximum_share: "approximately 5%"
      avoid: [cheap_clear_plastic, oversized_novelty_furniture]
    - id: hand_finished_lacquer_or_colored_glass
      use: [single_side_piece, cabinet_accent, vessel, light_detail]
      maximum_focal_objects_per_view: 1

surface_system:
  major_wall_options: [warm_mineral_plaster, woven_silk_or_linen_wallcovering, subtle_brush_ripple_or_abstract_cloud_jacquard, shallow_upholstered_textile_panel, matte_dark_timber_datum, single_honed_stone_plane]
  ceiling_options: [shallow_plaster_reveal, timber_lined_perimeter_reveal, slim_bronze_or_dark_timber_datum, continuous_warm_cove, focused_wall_wash]
  lighting_options: [paper_or_silk_diffused_lantern_fixture, alabaster_or_stone_pendant, restrained_bronze_fixture, integrated_cove_and_wall_wash]
  rules: [resolve_at_least_one_major_wall_when_editable, replace_or_integrate_generic_construction_downlights, never_change_structural_ceiling_geometry]

color_system:
  dominant:
    target_share: "approximately 60%"
    colors: [warm_ivory, pale_stone, light_greige]
  secondary:
    target_share: "approximately 25-30%"
    colors: [wood_brown, mushroom_taupe, charcoal]
  accent:
    maximum_share: "approximately 10-15%"
    colors: [ink_black, aged_bronze, muted_jade, olive_green]
  forbidden:
    - saturated_red_and_bright_gold
    - multiple_high_saturation_jewel_tones
    - all_black_hospitality_palette
    - cold_white_mirror_silver_showroom_palette

anti_patterns:
  traditional_symbolism:
    - ornate Chinese carving
    - dragon and phoenix motifs
    - dense cloud patterns
    - glossy red rosewood furniture set
    - replica dynasty furniture
    - red lantern theme
  japandi_confusion:
    - tatami
    - shoji screens
    - Japanese tea room
    - floor-level dining table
    - all-pale-wood Japandi
    - exaggerated wabi-sabi decay
  hospitality_drift:
    - hotel lobby
    - reception lounge
    - banquet hall
    - monumental symmetry
    - oversized chandelier
    - theatrical hospitality lighting
    - excessive ceiling sculpture
  material_failures:
    - mirror-polished gold
    - glossy burgundy wood
    - busy multicolor marble
    - excessive black marble
    - too many competing materials

immutable_semantics:
  always_preserve:
    - source_aspect_ratio
    - crop
    - framing
    - camera_position
    - camera_height
    - focal_length_feel
    - vanishing_points
    - room_envelope
    - walls
    - columns
    - beams
    - ceiling_height
    - doors
    - windows
    - openings
    - door_and_window_panel_divisions
  preserve_by_default:
    - fixed_cabinet_boundaries
    - kitchen_service_locations
    - bathroom_service_locations
    - fireplace
  note: >-
    These are semantic requirements. The agent must enforce them with masks,
    spatial conditions and post-generation structural validation.

renovation_levels:
  furnish:
    editable: [movable_furniture, rugs, curtains, freestanding_lighting, art, plants, decor]
  refresh:
    editable: [paint, wall_finish, floor_finish, ceiling_finish_without_structural_change, shallow_perimeter_cove, cabinet_front_finish, movable_furniture, lighting, textiles, art, decor]
  light-remodel:
    editable: [explicitly_masked_non_structural_built_ins]
    requires_explicit_mask: true

room_recipes:
  living_room:
    required: [conversation_oriented_seating, one_contemporary_ming_derived_piece, one_primary_ink_wash_artwork, one_ceramic_or_stone_vessel, realistic_circulation]
    preferred: [restrained_stone_or_dark_timber_coffee_table, joinery_side_stool, one_architectural_plant, integrated_existing_tv_or_fireplace]
    avoid: [lobby_seating, double_living_room, oversized_chandelier]
  primary_bedroom:
    required: [quiet_enveloping_mood, designed_headboard_wall, functional_bedside_surfaces, layered_warm_light]
    preferred: [woven_or_upholstered_textile_panel, tactile_subtly_patterned_bedding, contemporary_joinery_stool_or_bench, optional_window_bench]
    avoid: [hotel_suite_staging, excessive_symmetry, floor_level_japanese_furniture]
  kitchen_dining:
    required: [functional_clearances, preserved_services, realistic_appliances]
    preferred: [matte_timber_cabinetry, quiet_stone, round_or_soft_rectangle_table]
    avoid: [display_kitchen_theater, dominant_wine_wall, impossible_floating_counter]
  bathroom:
    required: [preserved_fixture_locations, plausible_wet_zone, maintainable_surfaces]
    preferred: [honed_pale_stone, restrained_timber_vanity, textured_glass, soft_mirror_light]
    avoid: [hotel_spa, all_over_bookmatched_marble, decorative_indoor_tree, impossible_sunken_bath]

raw_shell_rules:
  immutable: [visible_walls, slab_edges, beams, columns, ceiling_planes, door_openings, window_openings]
  add: [substantial_coherent_finishes, shallow_non_structural_ceiling_treatment, layered_lighting, justified_cabinetry, complete_furniture_group, textiles, art, decor]
  never_invent: [new_windows, new_doors, fireplace, stairs, mezzanine, vaulted_ceiling, structural_opening]
  service_assumption: conservative

style_evaluation:
  scoring_range_per_dimension: [0, 4]
  publish_threshold: 22
  dimensions:
    - contemporary_language
    - abstract_eastern_expression
    - material_coherence
    - spatial_restraint
    - residential_livability
    - lighting_quality
    - differentiation_from_adjacent_styles
  hard_fail:
    - immutable_architecture_changed
    - source_aspect_ratio_changed
    - crop_or_camera_shift_reported
    - traditional_symbol_theme
    - japanese_room_language
    - hospitality_or_showroom_conversion
    - impossible_kitchen_or_bathroom_services
    - blocked_circulation
    - style_reduced_to_single_symbolic_artwork_or_vase
    - generic_furniture_without_modern_east_lineage
    - finish_enabled_result_has_blank_ceiling_or_only_isolated_downlights
    - finish_enabled_result_leaves_major_wall_unresolved
  identity_gate:
    minimum_families_present: 5
    families:
      spatial_order: [calibrated_negative_space, balanced_asymmetry, dark_linear_datum, framed_sightline]
      designed_surfaces: [mineral_or_textile_wall, matte_dark_timber_datum, honed_stone_anchor, completed_ceiling_surface]
      furniture_lineage: [contemporary_ming_derived_chair_stool_bench_or_table, comfortable_contemporary_primary_seating]
      material_contrast: [mineral_or_honed_stone, matte_dark_timber, three_tactile_textile_layers, restrained_bronze_or_new_material_accent]
      cultural_abstraction: [ink_wash_abstract_art, paper_or_silk_diffused_light, celadon_smoky_glazed_black_stoneware_or_stone_vessel]
      complete_residential_composition: [properly_scaled_furniture_group, functional_side_pieces, layered_window_treatment, designed_ceiling_and_lighting]

retrieval:
  required_keys: [style_id, profile, room_type, renovation_level]
  optional_keys: [room_size_band, daylight_level]
  retrieve_entire_knowledge_base: false
